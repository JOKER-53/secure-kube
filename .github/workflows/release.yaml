name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  # ── Job 1: Build and push container image ──────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ steps.owner.outputs.lc }}/secure-kube
            ${{ secrets.DOCKERHUB_USERNAME }}/secure-kube
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=main
            type=sha,prefix=main-,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Scan container image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ steps.owner.outputs.lc }}/secure-kube:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: 0
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ── Job 2: Create GitHub Release (tag pushes only) ──────────────────
  github-release:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]' | sed -n '2p')
          CURRENT_TAG=${GITHUB_REF_NAME}

          if [ -z "${PREV_TAG}" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            COMMITS=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD")
          fi

          FEATURES=$(echo "${COMMITS}" | grep -i "^- feat" || true)
          FIXES=$(echo "${COMMITS}"    | grep -i "^- fix"  || true)
          DOCS=$(echo "${COMMITS}"     | grep -i "^- docs" || true)
          OTHER=$(echo "${COMMITS}"    | grep -iv "^- feat\|^- fix\|^- docs" || true)

          {
            echo "CHANGELOG<<EOF"
            echo "## What's changed in ${CURRENT_TAG}"
            echo ""
            [ -n "${FEATURES}" ] && echo "### Features" && echo "${FEATURES}" && echo ""
            [ -n "${FIXES}" ]    && echo "### Bug fixes" && echo "${FIXES}"    && echo ""
            [ -n "${DOCS}" ]     && echo "### Documentation" && echo "${DOCS}"  && echo ""
            [ -n "${OTHER}" ]    && echo "### Other changes" && echo "${OTHER}"  && echo ""
            echo "---"
            echo "**Docker images:**"
            echo "\`\`\`"
            echo "docker pull ghcr.io/${{ steps.owner.outputs.lc }}/secure-kube:${CURRENT_TAG}"
            echo "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/secure-kube:${CURRENT_TAG}"
            echo "\`\`\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release archive
        run: |
          git archive --format=zip --prefix=securekube-${GITHUB_REF_NAME}/ \
            HEAD -o securekube-${GITHUB_REF_NAME}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "SecureKube ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          files: securekube-${{ github.ref_name }}.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
