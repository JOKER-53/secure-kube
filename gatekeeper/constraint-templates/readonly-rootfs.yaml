# Pod Security Standards (Restricted) — read-only root filesystem
# limits blast radius if a container is compromised.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirereadonlyrootfs
spec:
  crd:
    spec:
      names:
        kind: K8sRequireReadOnlyRootFS
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirereadonlyrootfs

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.securityContext.readOnlyRootFilesystem == true
          msg := sprintf("container <%v> must set securityContext.readOnlyRootFilesystem = true", [c.name])
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }
