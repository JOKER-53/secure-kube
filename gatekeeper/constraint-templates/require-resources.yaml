# NIST SP 800-190 §4.4.1 / general cluster stability — pods without
# requests/limits can starve neighbors or get OOM-killed unpredictably,
# and make noisy-neighbor DoS trivial in a shared cluster.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequireresources
spec:
  crd:
    spec:
      names:
        kind: K8sRequireResources
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequireresources

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.resources.requests.cpu
          msg := sprintf("container <%v> is missing resources.requests.cpu", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.resources.requests.memory
          msg := sprintf("container <%v> is missing resources.requests.memory", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.resources.limits.cpu
          msg := sprintf("container <%v> is missing resources.limits.cpu", [c.name])
        }

        violation[{"msg": msg}] {
          c := input_containers[_]
          not c.resources.limits.memory
          msg := sprintf("container <%v> is missing resources.limits.memory", [c.name])
        }

        input_containers[c] {
          c := input.review.object.spec.containers[_]
        }
