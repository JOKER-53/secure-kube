apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sCapabilitiesAndPorts
metadata:
  name: capabilities-and-ports
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces: ["kube-system", "gatekeeper-system", "falco", "calico-system", "argocd"]
  parameters:
    allowedCapabilities:
      - "NET_BIND_SERVICE"   # common legit need: bind to a low port without full root
  enforcementAction: deny
