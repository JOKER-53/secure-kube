apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securekube-argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: securekube-infra
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      targetRevision: 10.4.1
      chart: argo-cd
      helm:
        valueFiles:
          - $values/helm/argocd-values.yaml
    - repoURL: https://github.com/PLACEHOLDER/securekube
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
