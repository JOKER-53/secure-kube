apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securekube-gatekeeper-constraints
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: securekube

  source:
    repoURL: https://github.com/PLACEHOLDER/securekube   # replaced by make argocd
    targetRevision: main
    path: gatekeeper/constraints

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: constraints.gatekeeper.sh
      kind: "*"
      jsonPointers:
        - /status
