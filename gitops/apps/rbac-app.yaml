apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: securekube-rbac
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: securekube

  source:
    repoURL: https://github.com/PLACEHOLDER/securekube   # replaced by make argocd
    targetRevision: main
    path: kustomize/base/rbac

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
