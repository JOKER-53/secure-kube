# Updated Falco Helm values — wires Falco Sidekick to push alerts
# to Prometheus Alertmanager and expose metrics for Prometheus scraping.
driver:
  kind: modern_ebpf

falcosidekick:
  enabled: true
  webui:
    enabled: true
  config:
    # Push Falco alerts to Prometheus Alertmanager
    alertmanager:
      hostport: "http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093"
      minimumpriority: "warning"
      checkcert: false
    # Expose /metrics for Prometheus to scrape
    prometheusmetrics:
      enabled: true
      port: 2802

falco:
  jsonOutput: true
  jsonIncludeOutputProperty: true
  rules_file:
    - /etc/falco/falco_rules.yaml
    - /etc/falco/falco_rules.local.yaml
    - /etc/falco/k8s_audit_rules.yaml

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1024Mi
